<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for gradients -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1e3a8a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Bubble/Wave Graphic -->
  <g filter="url(#shadow)">
    <!-- Main Drop Shape -->
    <path d="M250,50 C330,130 380,210 380,290 C380,361.8 321.8,420 250,420 C178.2,420 120,361.8 120,290 C120,210 170,130 250,50 Z" fill="url(#blueGrad)" />
    
    <!-- Secondary Leaf/Wave Shape -->
    <path d="M250,150 C300,200 330,250 330,300 C330,344.2 294.2,380 250,380 C205.8,380 170,344.2 170,300 C170,250 200,200 250,150 Z" fill="url(#greenGrad)" opacity="0.8" />
    
    <!-- Highlights -->
    <circle cx="210" cy="240" r="15" fill="#ffffff" opacity="0.6" />
    <circle cx="230" cy="215" r="8" fill="#ffffff" opacity="0.6" />
  </g>
</svg>
